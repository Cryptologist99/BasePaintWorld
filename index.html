<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasePaint World - Start</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1E2735;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #073eb1;
            border-bottom: 2px solid #fde047;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-size: 13px;
            z-index: 1500;
            box-sizing: border-box;
        }

        .site-header-brand {
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .site-header-brand:hover {
            color: #fde047;
        }

        .site-header-link {
            color: #fde047;
            text-decoration: none;
            font-weight: bold;
        }

        .site-header-link:hover {
            color: #ffffff;
        }

        .site-header-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 38px;
        }

        #startscreen {
            max-width: 100vw;
            max-height: calc(100vh - 38px);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .clickable-area {
            position: absolute;
            width: 50%;
            height: 8%;
            cursor: pointer;
            /* Uncomment to see clickable areas for debugging */
            /* background: rgba(255, 0, 0, 0.3); */
        }

        .mint-area {
            top: 78.5%;
            left: 31%;
            width: 38%;
            height: 3.8%;
        }

        .canvas-area {
            top: 82.65%;
            left: 20%;
            width: 60%;
            height: 3.8%;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="site-header-brand" href="index.html">BasePaint World</a>
        <div class="site-header-links">
            <a class="site-header-link" href="about.html">About</a>
            <a class="site-header-link" href="https://basepaint.xyz" target="_blank" rel="noopener">basepaint.xyz &#8599;</a>
        </div>
    </header>

    <div class="container">
        <img id="startscreen" src="assets/startscreen-canvas.png" alt="BasePaint Start Screen">

        <!-- Clickable areas -->
        <div class="clickable-area mint-area" data-option="mint"></div>
        <div class="clickable-area canvas-area" data-option="canvas"></div>
    </div>

    <script>
        let selectedOption = 1; // 0 = mint, 1 = canvas (default to canvas)
        const options = ['mint', 'canvas'];
        const urls = {
            mint: 'https://basepaint.xyz/',
            canvas: 'canvas-navigator.html'
        };

        const images = {
            mint: 'assets/startscreen-mint.png',
            canvas: 'assets/startscreen-canvas.png'
        };

        const screenImage = document.getElementById('startscreen');

        function updateImage() {
            screenImage.src = images[options[selectedOption]];
        }

        function selectOption() {
            const option = options[selectedOption];
            const url = urls[option];
            if (option === 'mint') {
                window.open(url, '_blank', 'noopener');
                return;
            }
            if (window.GameAudio) {
                window.GameAudio.playEnterCanvas();
            }
            // Small delay so the SFX is audible before the page navigates away
            setTimeout(() => {
                window.location.href = url;
            }, 200);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                selectedOption = 0;
                updateImage();
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                selectedOption = 1;
                updateImage();
            } else if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                selectOption();
            }
        });

        // Click controls
        document.querySelectorAll('.clickable-area').forEach(area => {
            area.addEventListener('click', () => {
                const option = area.dataset.option;
                selectedOption = options.indexOf(option);
                updateImage();
                // Small delay so user can see selection before navigating
                setTimeout(selectOption, 150);
            });

            // Hover effect
            area.addEventListener('mouseenter', () => {
                const option = area.dataset.option;
                selectedOption = options.indexOf(option);
                updateImage();
            });
        });

        // Preload both images
        const preload1 = new Image();
        const preload2 = new Image();
        preload1.src = images.mint;
        preload2.src = images.canvas;

        // Initialize
        updateImage();
    </script>
    <script src="assets/audio.js"></script>
</body>
</html>
