<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasePaint Day 456 - Spot the Difference</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', 'Courier New', monospace;
            background: #1E2735;
            color: #fde047;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 38px);
            margin-top: 38px;
            overflow: hidden;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #073eb1;
            border-bottom: 2px solid #fde047;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-size: 13px;
            z-index: 1500;
            box-sizing: border-box;
        }

        .site-header-brand {
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .site-header-brand:hover {
            color: #fde047;
        }

        .site-header-link {
            color: #fde047;
            text-decoration: none;
            font-weight: bold;
        }

        .site-header-link:hover {
            color: #ffffff;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fde047;
            font-size: 32px;
        }

        .game-area {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidebar {
            /* Narrow screens: children act as direct flex items of .game-area,
               ordered via the `order` property so it still reads info -> canvas -> controls */
            display: contents;
        }

        .game-info {
            background: #283447;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #fde047;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
            order: 1;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #fde047;
            font-size: 24px;
            font-weight: bold;
        }

        .canvas-container {
            background: #141A24;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #fde047;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            flex: 1;
            min-height: 0;
            width: 100%;
            order: 2;
        }

        canvas {
            border: 1px solid #555;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-shrink: 0;
            order: 3;
        }

        /* Wide screens: put the info bar + controls in a side column next to the canvas
           instead of stacking everything vertically, since the square canvas leaves
           unused width once its height is maxed out. */
        @media (min-width: 900px) {
            .game-area {
                flex-direction: row;
                justify-content: center;
                align-items: stretch;
                gap: 20px;
            }

            .canvas-container {
                margin-bottom: 0;
            }

            .sidebar {
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 15px;
                width: 260px;
                flex-shrink: 0;
            }

            .sidebar .game-info {
                margin-bottom: 0;
            }

            .sidebar .controls {
                flex-direction: column;
            }
        }

        button {
            background: #fde047;
            color: #1E2735;
            border: none;
            padding: 15px 30px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
            transition: all 0.2s;
        }

        button:hover {
            background: #facc15;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        .file-inputs {
            background: #283447;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #fde047;
            margin-bottom: 20px;
        }

        .file-inputs h3 {
            color: #fde047;
            margin-bottom: 15px;
        }

        .file-input-group {
            margin-bottom: 15px;
        }

        .file-input-group label {
            display: block;
            color: #aaa;
            margin-bottom: 5px;
        }

        input[type="file"] {
            background: #333;
            color: #fde047;
            padding: 10px;
            border: 1px solid #fde047;
            border-radius: 4px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            width: 100%;
        }

        .hidden {
            display: none;
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 3000;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 8px;
            height: 14px;
            opacity: 0.9;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translate(var(--drift), 110vh) rotate(var(--spin));
                opacity: 0.7;
            }
        }

        .canvas-info-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(253, 224, 71, 0.9);
            color: #1E2735;
            border: 2px solid #fde047;
            font-size: 24px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
            min-width: 50px;
            max-width: 50px;
            height: 50px;
            padding: 0;
        }

        .canvas-info-button:hover {
            min-width: 0;
            max-width: 600px;
            padding: 8px 16px;
            background: rgba(253, 224, 71, 1);
        }

        .canvas-info-icon {
            flex-shrink: 0;
        }

        .canvas-info-text {
            flex-shrink: 0;
            width: 0;
            margin-left: 0;
            overflow: hidden;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .canvas-info-button:hover .canvas-info-text {
            width: auto;
            margin-left: 8px;
            opacity: 1;
        }

        /* Achievement System */
        .achievement-button {
            position: fixed;
            top: 48px;
            right: 20px;
            background: #fde047;
            color: #1E2735;
            border: 2px solid #fde047;
            padding: 10px 20px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            z-index: 1000;
            transition: all 0.3s;
        }

        .achievement-button:hover {
            background: #facc15;
            transform: scale(1.05);
        }

        .achievement-notification {
            position: fixed;
            top: 108px;
            right: 20px;
            background: rgba(253, 224, 71, 0.95);
            color: #1E2735;
            border: 3px solid #fde047;
            border-radius: 12px;
            padding: 20px;
            font-family: 'Roboto Mono', 'Courier New', monospace;
            z-index: 1001;
            min-width: 300px;
            box-shadow: 0 4px 20px rgba(253, 224, 71, 0.5);
            animation: slideInFade 0.5s ease-out, slideOutFade 0.5s ease-in 3.5s;
        }

        @keyframes slideInFade {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutFade {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .achievement-notification-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .achievement-notification-icon {
            font-size: 40px;
            text-align: center;
            margin-bottom: 10px;
        }

        .achievement-notification-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .achievement-notification-desc {
            font-size: 14px;
            color: #141A24;
        }

        .achievement-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            overflow-y: auto;
        }

        .achievement-modal-content {
            background: #1E2735;
            border: 3px solid #fde047;
            border-radius: 12px;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            position: relative;
        }

        .achievement-modal-header {
            font-size: 28px;
            color: #fde047;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .achievement-modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: #fde047;
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Roboto Mono', 'Courier New', monospace;
        }

        .achievement-modal-close:hover {
            color: #facc15;
        }

        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .achievement-item {
            background: #283447;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .achievement-item.unlocked {
            border-color: #fde047;
            background: #1a3a2a;
        }

        .achievement-item-icon {
            font-size: 32px;
            min-width: 40px;
            text-align: center;
        }

        .achievement-item-icon.locked {
            filter: grayscale(100%);
            opacity: 0.3;
        }

        .achievement-item-info {
            flex: 1;
        }

        .achievement-item-name {
            font-size: 18px;
            font-weight: bold;
            color: #fde047;
            margin-bottom: 5px;
        }

        .achievement-item-name.locked {
            color: #666;
        }

        .achievement-item-desc {
            font-size: 14px;
            color: #aaa;
        }

        .achievement-item-desc.locked {
            color: #555;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="site-header-brand" href="index.html">BasePaint World</a>
        <a class="site-header-link" href="https://basepaint.xyz" target="_blank" rel="noopener">basepaint.xyz &#8599;</a>
    </header>

    <div class="container">
        <div class="file-inputs" id="file-inputs">
            <h3>📁 Load Game Files</h3>
            <div class="file-input-group">
                <label for="canvas-file">1. Load Canvas Image (day-456.png):</label>
                <input type="file" id="canvas-file" accept="image/*">
            </div>
            <div class="file-input-group">
                <label for="differences-file">2. Load Differences JSON (day-456-differences.json):</label>
                <input type="file" id="differences-file" accept=".json">
            </div>
        </div>

        <div class="game-area" id="game-area">
            <div class="canvas-container hidden" id="canvas-container">
                <canvas id="game-canvas"></canvas>
            </div>

            <div class="sidebar">
                <div class="game-info hidden" id="game-info">
                    <div class="info-item">
                        <div class="info-label">Differences Found</div>
                        <div class="info-value" id="found-count">0 / ?</div>
                    </div>
                    <div class="info-item hidden" id="completion-time-item">
                        <div class="info-label">Completed!</div>
                        <div class="info-value" id="completion-time-value">--</div>
                    </div>
                </div>

                <div class="controls hidden" id="controls">
                    <button id="restart-btn">Restart Game</button>
                    <button id="return-overworld-btn">Return to Overworld</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Achievement System UI -->
    <button class="achievement-button" onclick="openAchievementModal()">🏆 Achievements</button>

    <!-- Canvas Info Button -->
    <a class="canvas-info-button" href="https://basepaint.xyz/canvas/456" target="_blank">
        <span class="canvas-info-icon">🖼️</span>
        <span class="canvas-info-text">Canvas 456: Spot the Difference</span>
    </a>

    <div id="achievement-modal" class="achievement-modal">
        <div class="achievement-modal-content">
            <button class="achievement-modal-close" onclick="closeAchievementModal()">×</button>
            <div class="achievement-modal-header">🏆 Achievements</div>
            <div id="achievement-list" class="achievement-list"></div>
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="clearAllAchievements()" style="background: #ff4444; color: white; border: 2px solid #ff4444; padding: 10px 20px; font-family: 'Roboto Mono', 'Courier New', monospace; font-weight: bold; cursor: pointer; border-radius: 8px;">Clear All Achievements</button>
            </div>
        </div>
    </div>

    <script>
        // Game State
        let canvas, ctx;
        let canvasImage = null;
        let differencesData = null;
        let regionPairs = []; // Changed from regions to regionPairs
        let foundPairs = new Set(); // Changed from foundRegions to foundPairs
        let scale = 3;  // 3x upscale for larger display
        let gameStartTime = null;

        // Constants
        const CANVAS_WIDTH = 256;
        const CANVAS_HEIGHT = 256;
        const LEFT_MAX = 126;
        const RIGHT_MIN = 129;

        // ===== ACHIEVEMENT SYSTEM =====
        let achievements = [];
        let unlockedAchievements = new Set();
        let achievementNotificationQueue = [];
        let currentNotification = null;

        async function loadAchievements() {
            try {
                const response = await fetch('assets/achievements.json');
                if (!response.ok) throw new Error('File not found');
                achievements = await response.json();
            } catch (error) {
                console.warn('⚠️ Could not load achievements.json');
                achievements = [];
            }

            const saved = localStorage.getItem('basepaint_achievements');
            if (saved) {
                unlockedAchievements = new Set(JSON.parse(saved));
            }
        }

        function unlockAchievement(achievementId) {
            if (unlockedAchievements.has(achievementId)) return;

            const achievement = achievements.find(a => a.id === achievementId);
            if (!achievement) {
                console.error(`Achievement ${achievementId} not found`);
                return;
            }

            unlockedAchievements.add(achievementId);
            localStorage.setItem('basepaint_achievements', JSON.stringify([...unlockedAchievements]));

            achievementNotificationQueue.push(achievement);
            if (!currentNotification) {
                showNextNotification();
            }
        }

        function showNextNotification() {
            if (achievementNotificationQueue.length === 0) {
                currentNotification = null;
                return;
            }

            const achievement = achievementNotificationQueue.shift();
            currentNotification = achievement;

            const notification = document.createElement('div');
            notification.className = 'achievement-notification';
            notification.innerHTML = `
                <div class="achievement-notification-title">🏆 Achievement Unlocked!</div>
                <div class="achievement-notification-icon">${achievement.icon}</div>
                <div class="achievement-notification-name">${achievement.name}</div>
                <div class="achievement-notification-desc">${achievement.description}</div>
            `;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
                showNextNotification();
            }, 4000);
        }

        function openAchievementModal() {
            const modal = document.getElementById('achievement-modal');
            const list = document.getElementById('achievement-list');

            list.innerHTML = '';

            for (const achievement of achievements) {
                const isUnlocked = unlockedAchievements.has(achievement.id);

                // Secret achievements stay off the list entirely until unlocked
                if (achievement.secret && !isUnlocked) continue;

                const item = document.createElement('div');
                item.className = `achievement-item ${isUnlocked ? 'unlocked' : ''}`;

                item.innerHTML = `
                    <div class="achievement-item-icon ${isUnlocked ? '' : 'locked'}">
                        ${isUnlocked ? achievement.icon : '🔒'}
                    </div>
                    <div class="achievement-item-info">
                        <div class="achievement-item-name ${isUnlocked ? '' : 'locked'}">
                            ${isUnlocked ? achievement.name : '?????'}
                        </div>
                        <div class="achievement-item-desc ${isUnlocked ? '' : 'locked'}">
                            ${isUnlocked ? achievement.description : '?????'}
                        </div>
                    </div>
                `;

                list.appendChild(item);
            }

            modal.style.display = 'block';
        }

        function closeAchievementModal() {
            document.getElementById('achievement-modal').style.display = 'none';
        }

        function clearAllAchievements() {
            if (confirm('Are you sure you want to clear all achievements? This cannot be undone.')) {
                unlockedAchievements.clear();
                localStorage.removeItem('basepaint_achievements');
                openAchievementModal();
            }
        }

        document.addEventListener('click', (e) => {
            const modal = document.getElementById('achievement-modal');
            if (e.target === modal) {
                closeAchievementModal();
            }
        });

        // Load achievements on start
        const achievementsReady = loadAchievements();

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            setupEventListeners();
            
            // Auto-load files from expected paths
            autoLoadFiles();
        });

        function autoLoadFiles() {
            // Try to load day-456.png and day-456-differences.json automatically
            loadImageFromPath('assets/day-456.png', (img) => {
                canvasImage = img;
                checkGameReady();
            });

            fetch('assets/day-456-differences.json')
                .then(response => response.json())
                .then(data => {
                    differencesData = data;
                    checkGameReady();
                })
                .catch(error => {
                    console.log('Auto-load failed, use file inputs:', error);
                    // If auto-load fails, user can still use file inputs
                });
        }

        function loadImageFromPath(path, callback) {
            const img = new Image();
            img.onload = () => callback(img);
            img.onerror = () => console.log(`Could not auto-load ${path}`);
            img.src = path;
        }

        function setupEventListeners() {
            document.getElementById('canvas-file').addEventListener('change', handleCanvasLoad);
            document.getElementById('differences-file').addEventListener('change', handleDifferencesLoad);
            canvas.addEventListener('click', handleCanvasClick);
            document.getElementById('restart-btn').addEventListener('click', restartGame);
            document.getElementById('return-overworld-btn').addEventListener('click', returnToOverworld);
        }

        function returnToOverworld() {
            // Navigate back to the canvas navigator
            window.location.href = 'canvas-navigator.html';
        }

        function handleCanvasLoad(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvasImage = img;
                    checkGameReady();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleDifferencesLoad(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    differencesData = JSON.parse(event.target.result);
                    checkGameReady();
                } catch (error) {
                    alert('Error loading differences file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        function checkGameReady() {
            if (canvasImage && differencesData) {
                initializeGame();
            }
        }

        function initializeGame() {
            // Hide file inputs, show game
            document.getElementById('file-inputs').classList.add('hidden');
            document.getElementById('game-info').classList.remove('hidden');
            document.getElementById('canvas-container').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');

            // Process differences into individual regions first
            const allRegions = groupPixelsIntoRegions(differencesData.differences);
            console.log(`Found ${allRegions.length} individual regions`);

            // Pair up left and right regions
            regionPairs = createRegionPairs(allRegions);
            console.log(`Found ${regionPairs.length} region pairs`);

            // Update UI with pair count
            document.getElementById('found-count').textContent = `0 / ${regionPairs.length}`;

            // Setup canvas
            canvas.width = CANVAS_WIDTH * scale;
            canvas.height = CANVAS_HEIGHT * scale;

            gameStartTime = Date.now();

            // Render initial state
            renderGame();
        }

        function groupPixelsIntoRegions(pixels) {
            // Create a 2D grid to track which pixels belong to which region
            const grid = new Map();
            pixels.forEach(p => {
                const key = `${p.x},${p.y}`;
                grid.set(key, { ...p, regionId: null });
            });

            const regions = [];
            let currentRegionId = 0;

            // Flood fill to find connected regions
            pixels.forEach(pixel => {
                const key = `${pixel.x},${pixel.y}`;
                const gridPixel = grid.get(key);
                
                if (gridPixel && gridPixel.regionId === null) {
                    const region = floodFill(grid, pixel.x, pixel.y, currentRegionId);
                    if (region.length > 0) {
                        regions.push({
                            id: currentRegionId,
                            pixels: region,
                            side: pixel.side,
                            center: calculateCenter(region)
                        });
                        currentRegionId++;
                    }
                }
            });

            return regions;
        }

        function floodFill(grid, startX, startY, regionId) {
            const region = [];
            const stack = [{x: startX, y: startY}];
            const visited = new Set();

            while (stack.length > 0) {
                const {x, y} = stack.pop();
                const key = `${x},${y}`;

                if (visited.has(key)) continue;
                visited.add(key);

                const pixel = grid.get(key);
                if (!pixel || pixel.regionId !== null) continue;

                pixel.regionId = regionId;
                region.push({x, y});

                // Check 8 neighbors (including diagonals)
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        if (dx === 0 && dy === 0) continue;
                        stack.push({x: x + dx, y: y + dy});
                    }
                }
            }

            return region;
        }

        function calculateCenter(pixels) {
            const sumX = pixels.reduce((sum, p) => sum + p.x, 0);
            const sumY = pixels.reduce((sum, p) => sum + p.y, 0);
            return {
                x: Math.round(sumX / pixels.length),
                y: Math.round(sumY / pixels.length)
            };
        }

        function createRegionPairs(allRegions) {
            const pairs = [];
            const usedRegions = new Set();

            // Separate left and right regions
            const leftRegions = allRegions.filter(r => r.side === 'left');
            const rightRegions = allRegions.filter(r => r.side === 'right');

            // Match left regions with corresponding right regions
            leftRegions.forEach(leftRegion => {
                if (usedRegions.has(leftRegion.id)) return;

                // Calculate expected right position
                const expectedX = leftRegion.center.x + 129;

                // Find matching right region
                const rightRegion = rightRegions.find(r => {
                    if (usedRegions.has(r.id)) return false;
                    
                    const xDiff = Math.abs(r.center.x - expectedX);
                    const yDiff = Math.abs(r.center.y - leftRegion.center.y);
                    
                    return xDiff < 10 && yDiff < 10; // Tolerance of 10 pixels
                });

                if (rightRegion) {
                    pairs.push({
                        id: pairs.length,
                        left: leftRegion,
                        right: rightRegion
                    });
                    usedRegions.add(leftRegion.id);
                    usedRegions.add(rightRegion.id);
                }
            });

            return pairs;
        }

        function renderGame() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw image
            ctx.drawImage(canvasImage, 0, 0, canvas.width, canvas.height);

            // Draw checkmarks for found pairs
            foundPairs.forEach(pairId => {
                const pair = regionPairs[pairId];
                if (!pair) return;

                // Draw checkmark on both left and right sides
                drawCheckmark(pair.left.center.x, pair.left.center.y);
                drawCheckmark(pair.right.center.x, pair.right.center.y);
            });
        }

        function drawCheckmark(x, y) {
            const scaledX = x * scale;
            const scaledY = y * scale;

            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2 * scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Draw checkmark (✓)
            ctx.beginPath();
            // Left part of check (going down-right)
            ctx.moveTo(scaledX - 3 * scale, scaledY);
            ctx.lineTo(scaledX - 1 * scale, scaledY + 2 * scale);
            // Right part of check (going up-right)
            ctx.lineTo(scaledX + 3 * scale, scaledY - 2 * scale);
            ctx.stroke();
        }

        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            // Canvas may be displayed smaller/larger than its internal resolution
            // (responsive scaling), so map CSS pixels to canvas pixels first.
            const displayToCanvasX = canvas.width / rect.width;
            const displayToCanvasY = canvas.height / rect.height;
            const x = Math.floor(((e.clientX - rect.left) * displayToCanvasX) / scale);
            const y = Math.floor(((e.clientY - rect.top) * displayToCanvasY) / scale);

            // Find which pair was clicked (could be either left or right side)
            const clickedPair = findPairAtPoint(x, y);
            
            if (clickedPair && !foundPairs.has(clickedPair.id)) {
                foundPairs.add(clickedPair.id);
                renderGame();
                updateScore();
                checkCompletion();
            }
        }

        function findPairAtPoint(x, y) {
            return regionPairs.find(pair => {
                // Check if click is in left region
                const inLeft = pair.left.pixels.some(p => p.x === x && p.y === y);
                // Check if click is in right region
                const inRight = pair.right.pixels.some(p => p.x === x && p.y === y);
                
                return inLeft || inRight;
            });
        }

        function updateScore() {
            document.getElementById('found-count').textContent = 
                `${foundPairs.size} / ${regionPairs.length}`;
        }

        function checkCompletion() {
            if (foundPairs.size === regionPairs.length) {
                const elapsedMs = Date.now() - gameStartTime;

                launchConfetti();
                unlockAchievement('spot_the_difference_complete');
                if (elapsedMs < 30000) {
                    unlockAchievement('spot_the_difference_speedrun');
                }

                document.getElementById('completion-time-value').textContent = formatElapsedTime(elapsedMs);
                document.getElementById('completion-time-item').classList.remove('hidden');
            }
        }

        function formatElapsedTime(ms) {
            const totalSeconds = ms / 1000;
            if (totalSeconds < 60) {
                return `${totalSeconds.toFixed(1)}s`;
            }
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = Math.floor(totalSeconds % 60);
            return `${minutes}m ${seconds}s`;
        }

        function launchConfetti() {
            clearConfetti();

            const container = document.createElement('div');
            container.className = 'confetti-container';
            container.id = 'confetti-container';

            const colors = ['#fde047', '#ff4444', '#ffcc00', '#4488ff', '#ff66cc', '#ffffff'];
            const pieceCount = 80;

            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.setProperty('--drift', `${Math.random() * 200 - 100}px`);
                piece.style.setProperty('--spin', `${360 + Math.random() * 360}deg`);
                piece.style.animationDelay = `${Math.random() * 0.5}s`;
                piece.style.animationDuration = `${2.5 + Math.random() * 1.5}s`;
                container.appendChild(piece);
            }

            document.body.appendChild(container);
            setTimeout(clearConfetti, 4500);
        }

        function clearConfetti() {
            const existing = document.getElementById('confetti-container');
            if (existing) existing.remove();
        }

        function restartGame() {
            // Reset state
            foundPairs.clear();
            gameStartTime = Date.now();

            clearConfetti();
            document.getElementById('completion-time-item').classList.add('hidden');

            // Re-render
            renderGame();
            updateScore();
        }
    </script>
</body>
</html>
